[tool.poetry]
name = "fairqapi"
version = "2026.09.0"
description = "Future Air Quality API for Predictions."
authors = ["Sarah Wagner <sarah.wagner@inwt-statistics.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">3.14, <4.0"
fastapi = {extras = ["standard"], version = ">=0.135.3,<0.137.0"}
clickhouse-driver = "^0.2.10"
slowapi = "^0.1.9"
pytest = "^9.0.3"
pandas = "^3.0.2"
starlette-prometheus = "^0.10.0"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
[tool.poetry.group.dev.dependencies]
ruff=">=0.15.6,<0.16.0"
mypy=">=1.19.1,<2.0.0"
bumpver = "^2025.1131"


[tool.bumpver]
current_version = "2026.09.0"
version_pattern = "YYYY.0M.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"fairqapi/__init__.py" = ['__version__ = "{version}"']


[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "COM812", "D", "ISC001",
   "TC001", # Move third-party import into a type-checking block
    "TC002", # Move standard library import into a type-checking block
    "TC003", # Move first-party import into a type-checking block
]
per-file-ignores = { "*/test_*.py" = ["S101"] }
[tool.ruff.lint.flake8-type-checking]
quote-annotations = true

# might want to fix this in the long run
[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "float","str"]

[tool.mypy]
ignore_missing_imports = false
